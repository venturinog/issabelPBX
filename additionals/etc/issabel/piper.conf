; Issabel Text to Speech / Piper configuration.
;
; This file is read by /var/lib/asterisk/agi-bin/issabel-tts.agi.
; It is shipped with %config(noreplace): an administrator edit survives
; package upgrades.
;
; [pool] slots controls how many Piper processes may run at the same time.
; Every concurrent synthesis costs about 180 MiB of RAM. The value "auto"
; is replaced at install time by /usr/libexec/issabel-tts/piper-slots with
; a number computed from MemTotal and the CPU count. Set a number here to
; override it; the sizing script never overwrites a numeric value.

[paths]
piper     = /usr/bin/piper
sox       = /usr/bin/sox
voice_dir = /usr/share/issabel-piper/voices
; Cache and locks live under the Asterisk data directory on purpose: that tree
; already carries the selinux label the Asterisk domain is allowed to write.
; A new /var/cache path would need a policy module.
cache_dir = /var/lib/asterisk/issabel-tts/cache
locks_dir = /var/lib/asterisk/issabel-tts

[pool]
; auto or a positive integer
slots             = auto
; seconds a call waits for a free slot before giving up
timeout           = 20
; RAM budget per concurrent synthesis (measured peak is ~180 MiB)
per_slot_mb       = 256
; RAM reserved for the OS, Asterisk, MariaDB, httpd and backups
reserve_mb        = 1536
; hard cap regardless of how much RAM the machine has
max_slots         = 4
; do not start a synthesis when MemAvailable falls below this
min_available_mb  = 384

[cache]
; remove cached fragments older than this many days (0 disables pruning)
retention_days = 30
